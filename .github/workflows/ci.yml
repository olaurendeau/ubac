# La porte du depot, l'image de production et son deploiement : spec §10,
# lots R1 a R3 de la phase 2.
#
# Ce fichier est une seconde definition de « comment on teste », a cote du
# Makefile et de Compose. test/ci/workflow.test.ts le tient aligne sur
# package.json et sur les deux Dockerfile, et fait rougir la suite du poste
# quand il diverge. docs/integration-continue.md dit ce que la porte garantit,
# et ce qu'elle ne garantit pas.
name: ci

# Chaque poussee qui peut atteindre main : une PR vers main, et main lui-meme,
# ou arrive le commit de squash qu'aucune PR n'a teste tel quel. Une branche
# sans PR n'est pas fusionnable, elle n'est donc pas testee. Les tags v* (D4)
# servent a build, qui ne construit jamais une PR, et a deploy, qui ne part
# que d'eux.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Depot public : le jeton ne fait que lire le code. Le defaut du depot est plus
# large, et la suite fait tourner le code de toutes ses dependances.
permissions:
  contents: read

# Une rafale de poussees sur une PR ne fait tourner que la derniere. Sur main,
# rien n'est annule en cours de route : le meme workflow poussera une image a
# partir de R2, et une poussee interrompue ne se rattrape pas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Le nom `test` est un contrat : la protection de main l'epingle comme
  # controle requis. Le renommer desarmerait la protection sans rien rougir.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Le majeur du poste (Dockerfile) et de la production (Dockerfile.prod).
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # La couverture, et non `npm test` : elle rejoue toute la suite ET fait
      # respecter les 100 % de src/core/risk.ts. Les deux paieraient la suite
      # deux fois ; `npm test` seul ne garderait pas le seuil.
      - run: npm run test:coverage

  # L'image de production, taguee par SON SHA (spec §10, D4 = 2). Le job
  # reutilise les deux scripts du depot, et rien d'autre : il ne refait ni le
  # controle d'architecture ni celui du SHA embarque, qui existent et sortent en
  # erreur. Les recopier ici creerait une seconde definition libre de diverger.
  build:
    needs: test
    # Jamais sur une PR : checkout y place HEAD sur le commit de FUSION, que
    # build-image.sh lirait par git rev-parse. L'image serait taguee par un
    # commit qui disparait au merge, et decisions.git_sha designerait
    # l'introuvable. Les declencheurs push sont main et les tags v*.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      reference: ${{ steps.reference.outputs.reference }}
    # main et un tag v* peuvent designer le meme commit. Deux executions
    # simultanees constateraient toutes deux l'absence de l'image et la
    # pousseraient deux fois : le groupe par SHA les met en file, et la seconde
    # trouve l'image de la premiere.
    concurrency:
      group: build-${{ github.sha }}
      cancel-in-progress: false
    defaults:
      run:
        # bash explicite : -o pipefail, sans quoi un inspect en echec en tete
        # de tube passerait pour une sortie vide, et non pour une erreur.
        shell: bash
    env:
      REGISTRE: rg.fr-par.scw.cloud
      UBAC_IMAGE: rg.fr-par.scw.cloud/${{ vars.SCW_REGISTRY_NAMESPACE }}/ubac
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # La reference que build-image.sh construira : le meme git rev-parse, sur
      # le meme HEAD. GITHUB_ENV vit hors de l'arbre, qui reste propre. deploy la
      # recoit en sortie : il deploie l'image que ce job a verifiee ou trouvee.
      - name: reference de l'image
        id: reference
        run: |
          reference="${UBAC_IMAGE}:$(git rev-parse --verify HEAD)"
          echo "UBAC_REFERENCE=$reference" >> "$GITHUB_ENV"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
      # L'utilisateur nologin, et la cle secrete par l'ENTREE STANDARD : un
      # argument de ligne de commande finit dans une trace, et le journal est
      # public. Le secret n'existe que dans l'environnement de cette etape.
      - name: connexion au registre
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: printf '%s' "$SCW_SECRET_KEY" | docker login "$REGISTRE" --username nologin --password-stdin
      # Un tag v* est pose sur un commit deja construit par main. Reconstruire
      # ECRASERAIT sa reference par une image qui n'est pas bit a bit la meme,
      # et le retour en arriere gratuit de docs/deploiement.md §8 tomberait sans
      # qu'aucune etape n'echoue. Seul « not found » vaut absence : toute autre
      # erreur arrete le job plutot que de risquer une reecriture.
      - name: l'image de ce commit est-elle deja poussee
        id: registre
        run: |
          if sortie=$(docker buildx imagetools inspect "$UBAC_REFERENCE" 2>&1); then
            echo "deja dans le registre, rien n'est reconstruit ni reecrit : $UBAC_REFERENCE"
            echo "existe=oui" >> "$GITHUB_OUTPUT"
          elif [[ "$sortie" == *": not found" ]]; then
            echo "existe=non" >> "$GITHUB_OUTPUT"
          else
            echo "$sortie" >&2
            exit 1
          fi
      # --load, pas --push : verifier-image.sh fait TOURNER l'image, elle doit
      # etre dans le demon local. Un --push direct sauterait ses dix controles.
      - if: steps.registre.outputs.existe == 'non'
        run: ./scripts/build-image.sh "$UBAC_IMAGE"
      - if: steps.registre.outputs.existe == 'non'
        run: ./scripts/verifier-image.sh "$UBAC_REFERENCE"
      - if: steps.registre.outputs.existe == 'non'
        run: docker push "$UBAC_REFERENCE"
      # Le manifeste DU REGISTRE, ce que Scaleway ira chercher, et non l'image
      # locale que verifier-image.sh a inspectee. Un manifeste d'attestation
      # unknown/unknown n'est pas une plateforme : .Image l'ignore.
      - name: plateformes de l'image poussee
        run: |
          lues=$(docker buildx imagetools inspect "$UBAC_REFERENCE" --format '{{json .Image}}' \
            | jq -r 'if has("architecture") then "\(.os)/\(.architecture)" else keys | join(" ") end')
          echo "plateformes poussees : $lues"
          test "$lues" = linux/amd64
      - name: deconnexion du registre
        if: always()
        run: docker logout "$REGISTRE"

  # Le deploiement (spec §10, lot R3) : la definition du job Scaleway repointee
  # sur l'image de ce commit, et RIEN d'autre. L'image deployee place des ordres
  # reels : la relecture qui suit la mise a jour est le seul controle entre ce
  # job et le run de 7 h, et aucun humain ne regarde derriere elle (D7 = 2).
  deploy:
    needs: build
    # La rampe de R3 a R4 : un tag v* SEULEMENT. Poser un tag est un geste
    # delibere ; c'est l'humain, replace dans la boucle tant que la barriere de
    # migration n'existe pas. R4, et lui seul, ouvrira le push sur main.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Sans relecteur (D7) : la protection est la restriction de l'environnement
    # aux tags v*, posee dans la console (docs/integration-continue.md §8).
    environment: production
    permissions:
      contents: read
    # Un deploiement a la fois, quel que soit le tag : deux relectures croisees
    # compareraient chacune l'etat que l'autre vient d'ecrire.
    concurrency:
      group: deploy
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      UBAC_REFERENCE: ${{ needs.build.outputs.reference }}
      DEFINITION: ${{ vars.SCW_JOB_DEFINITION_ID }}
      # Le CLI refuse toute commande sans organisation (« organization ID is
      # required », constate au premier tag v0.3.0) : des variables de forge,
      # pas des secrets, posees pour tout le job afin qu'aucune etape scw ne
      # puisse les oublier.
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Un tag se pose sur n'importe quel commit, y compris sur une branche
      # jamais fusionnee. Seul un commit de main se deploie : c'est la
      # restriction a main de D7, que l'environnement ne sait pas dire d'un tag.
      - name: le commit du tag est sur main
        id: main
        run: git merge-base --is-ancestor HEAD origin/main
      # Le CLI a version et empreinte epinglees, relevees le 2026-09-27 dans le
      # SHA256SUMS de la release : aucune action tierce ne voit la cle.
      - name: CLI scw
        id: cli
        env:
          SCW_VERSION: 2.62.0
          SCW_SHA256: 7638c385c1a43a5d9022a63791769fd464e14314032a51411726f062f3053e67
        run: |
          [[ -n "$DEFINITION" ]] || { echo "variable de forge SCW_JOB_DEFINITION_ID absente" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/scw" "https://github.com/scaleway/scaleway-cli/releases/download/v$SCW_VERSION/scaleway-cli_${SCW_VERSION}_linux_amd64"
          echo "$SCW_SHA256  $RUNNER_TEMP/bin/scw" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/scw"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Ce que la production porte AVANT : la definition, son declencheur, ses
      # secrets. Tout va dans des fichiers et rien dans le journal : la
      # definition porte ses variables ordinaires EN CLAIR, et le journal est public.
      - name: lecture avant
        id: avant
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          scw jobs definition get "$DEFINITION" region=fr-par -o json > "$RUNNER_TEMP/avant-definition.json"
          scw jobs trigger list job-definition-id="$DEFINITION" region=fr-par -o json > "$RUNNER_TEMP/avant-declencheurs.json"
          scw jobs secret list job-definition-id="$DEFINITION" region=fr-par -o json > "$RUNNER_TEMP/avant-secrets.json"
      # Avant de toucher a quoi que ce soit : le tag precedent est ecrit, la
      # production est dans l'etat attendu, le run du matin est loin. Un refus
      # ici laisse la definition intacte. test/ci/deploiement.test.ts execute
      # ce script tel quel.
      - name: controles avant
        id: controles
        env:
          # 140 et non les 0,1 vCPU de la spec §10 : la valeur deployee depuis
          # la creation, retenue par le coordinateur le 2026-09-27.
          CPU_MVCPU: '140'
          MEMOIRE_MIO: '256'
          DELAI_S: '300'
          TENTATIVES: '0'
          DECLENCHEUR: daily
          FENETRE_MIN: '15'
          # Les variables sans lesquelles l'image refuse de demarrer : celles de
          # src/config/env.ts sans valeur par defaut. Ordinaires ou secretes.
          VARIABLES: >-
            DATABASE_URL COINBASE_API_KEY COINBASE_API_SECRET COINBASE_PORTFOLIO_UUID
            BREVO_API_KEY BREVO_SENDER BREVO_RECIPIENT NTFY_URL NTFY_TOPIC NTFY_TOKEN
            HEALTHCHECK_URL
        run: |
          avant="$RUNNER_TEMP/avant"
          # Les variables ordinaires sont en clair : masquees des maintenant, une
          # ligne qui les recopierait un jour ne montrerait que ***.
          jq -r '.environment_variables // {} | .[]' "$avant-definition.json" \
            | while IFS= read -r valeur; do [[ -z "$valeur" ]] || echo "::add-mask::$valeur"; done
          # Le tag precedent, avant tout controle : ces deux lignes SONT la
          # procedure de retour en arriere (docs/deploiement.md §8).
          precedente=$(jq -r '.image_uri' "$avant-definition.json")
          retour="scw jobs definition update $DEFINITION image-uri=$precedente region=fr-par"
          echo "image deployee jusqu'ici : $precedente"
          echo "retour en arriere : $retour"
          printf '### Retour en arriere\n\n    %s\n\n' "$retour" >> "$GITHUB_STEP_SUMMARY"
          motifs=$(jq -r -n \
            --slurpfile definition "$avant-definition.json" \
            --slurpfile declencheurs "$avant-declencheurs.json" \
            --slurpfile secrets "$avant-secrets.json" \
            --argjson cpu "$CPU_MVCPU" --argjson memoire "$MEMOIRE_MIO" \
            --argjson delai "$DELAI_S" --argjson tentatives "$TENTATIVES" \
            --arg declencheur "$DECLENCHEUR" --arg variables "$VARIABLES" '
            $definition[0] as $d
            | [$declencheurs[0] | if type == "array" then .[] else .triggers[] end] as $t
            | [$secrets[0] | if type == "array" then .[] else .secrets[] end | .env_var.name // empty] as $s
            | [ (if $d.cpu_limit != $cpu then "cpu-limit \($d.cpu_limit), attendu \($cpu)" else empty end),
                (if $d.memory_limit != $memoire then "memory-limit \($d.memory_limit), attendu \($memoire)" else empty end),
                (if ($d.job_timeout | tostring | sub("s$"; "") | tonumber? // null) != $delai
                 then "job-timeout \($d.job_timeout), attendu \($delai)s" else empty end),
                (if $d.retry_policy.max_retries != $tentatives
                 then "max-retries \($d.retry_policy.max_retries), attendu \($tentatives)" else empty end),
                (if $d.cron_schedule != null
                 then "un cron sur la definition : seul le declencheur ordonnance le job" else empty end),
                ((($variables | split(" ") | map(select(. != ""))) - ([$d.environment_variables // {} | keys[]] + $s))[]
                 | "variable \(.) absente : le job refuserait de demarrer"),
                (if ($t | length) != 1 or $t[0].name != $declencheur
                 then "declencheurs \([$t[].name]), attendu le seul « \($declencheur) »" else empty end)
              ] | .[]')
          if [[ -n "$motifs" ]]; then
            printf "REFUS, rien n'a ete modifie : %s\n" "$motifs" >&2
            exit 1
          fi
          # La fenetre se lit dans le declencheur lui-meme, dans SON fuseau :
          # aucune heure n'est figee ici, et le changement d'heure est celui de
          # la production.
          ligne=$(jq -r '(if type == "array" then .[] else .triggers[] end)
            | [.cron_config.schedule, .cron_config.timezone] | @tsv' "$avant-declencheurs.json")
          IFS=$'\t' read -r horaire fuseau <<< "$ligne"
          if [[ ! "$horaire" =~ ^([0-9]{1,2})\ ([0-9]{1,2})\ \*\ \*\ \*$ || ! -f "/usr/share/zoneinfo/$fuseau" ]]; then
            echo "REFUS, rien n'a ete modifie : declencheur « $horaire » en « $fuseau », forme non lue (attendu « M H * * * » et un fuseau connu)" >&2
            exit 1
          fi
          run=$(( 10#${BASH_REMATCH[2]} * 60 + 10#${BASH_REMATCH[1]} ))
          read -r h m <<< "$(TZ="$fuseau" date +'%H %M')"
          ecart=$(( (10#$h * 60 + 10#$m - run + 1440) % 1440 ))
          (( ecart <= 720 )) || ecart=$(( 1440 - ecart ))
          if (( ecart <= FENETRE_MIN )); then
            echo "REFUS, rien n'a ete modifie : il est $h:$m en $fuseau, a $ecart min du run « $horaire » ; relancer le job hors des $FENETRE_MIN min qui l'entourent" >&2
            exit 1
          fi
          echo "controles avant : etat attendu, run a $ecart min"
      # L'image, et RIEN d'autre. Une mise a jour qui passe des
      # environment-variables REMPLACE la table entiere chez Scaleway.
      - name: mise a jour
        id: mise-a-jour
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: scw jobs definition update "$DEFINITION" image-uri="$UBAC_REFERENCE" region=fr-par -o json > /dev/null
      - name: lecture apres
        id: apres
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          scw jobs definition get "$DEFINITION" region=fr-par -o json > "$RUNNER_TEMP/apres-definition.json"
          scw jobs trigger list job-definition-id="$DEFINITION" region=fr-par -o json > "$RUNNER_TEMP/apres-declencheurs.json"
          scw jobs secret list job-definition-id="$DEFINITION" region=fr-par -o json > "$RUNNER_TEMP/apres-secrets.json"
      # LA RELECTURE : l'image est la nouvelle, et tout le reste vaut ce qu'il
      # valait avant — reglages, variables, declencheur, secrets. L'etat d'avant
      # ayant passe les controles, l'egalite porte les valeurs epinglees. Les
      # ecarts se nomment par leur cle, jamais par leur valeur.
      - name: relecture
        id: relecture
        run: |
          motifs=$(jq -r -n \
            --slurpfile av "$RUNNER_TEMP/avant-definition.json" --slurpfile ap "$RUNNER_TEMP/apres-definition.json" \
            --slurpfile dav "$RUNNER_TEMP/avant-declencheurs.json" --slurpfile dap "$RUNNER_TEMP/apres-declencheurs.json" \
            --slurpfile sav "$RUNNER_TEMP/avant-secrets.json" --slurpfile sap "$RUNNER_TEMP/apres-secrets.json" \
            --arg image "$UBAC_REFERENCE" '
            def liste: if type == "array" then . else (.triggers // .secrets) end;
            def par(cle): liste | map({(cle): .}) | add // {};
            def ecarts($a; $b; $quoi):
              ($a + $b | keys[]) as $k | select($a[$k] != $b[$k])
              | "\($quoi) \($k) : ajoute, retire ou change pendant le deploiement";
            [ (if $ap[0].image_uri != $image then "image-uri relue « \($ap[0].image_uri) », attendu « \($image) »" else empty end),
              ecarts($av[0] | del(.image_uri, .updated_at, .environment_variables);
                     $ap[0] | del(.image_uri, .updated_at, .environment_variables); "reglage"),
              ecarts($av[0].environment_variables // {}; $ap[0].environment_variables // {}; "variable"),
              ecarts($dav[0] | par(.name); $dap[0] | par(.name); "declencheur"),
              ecarts($sav[0] | par(.env_var.name // .file.path // .secret_id);
                     $sap[0] | par(.env_var.name // .file.path // .secret_id); "secret")
            ] | .[]')
          if [[ -n "$motifs" ]]; then
            printf "RELECTURE EN ECHEC, la production a change : %s\n" "$motifs" >&2
            exit 1
          fi
          jq -r '"relu : \(.image_uri), cpu \(.cpu_limit), memoire \(.memory_limit), delai \(.job_timeout), tentatives \(.retry_policy.max_retries), variables \(.environment_variables | keys | join(" "))"' \
            "$RUNNER_TEMP/apres-definition.json" | tee -a "$GITHUB_STEP_SUMMARY"
      # Les lectures portent les variables ordinaires en clair.
      - name: effacement des lectures
        if: always()
        run: rm -f "$RUNNER_TEMP"/avant-*.json "$RUNNER_TEMP"/apres-*.json
